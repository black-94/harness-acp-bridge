name: Publish to npm

# 触发方式（推送 tag 即暂存）：
#   v0.1.4                  -> 依次暂存 server -> mcp -> pi-extension
#   server-v0.1.4           -> 只暂存 server
#   mcp-v0.1.4              -> 只暂存 mcp
#   pi-extension-v0.1.4     -> 只暂存 pi-extension
# tag 中的版本号必须与对应 package.json 的 version 一致，否则流水线失败。
#
# 发布方式：NPM_TOKEN 是 stage-only token（Read and write (stage only)），CI 只能用
# `npm stage publish` 把版本送进待审队列，不会直接上架。流水线跑完后由启用 2FA 的维护者批准：
#   npm stage list
#   npm stage view <stage-id>
#   npm stage approve <stage-id> --otp <code>      # 也可以直接在 npmjs.com 网页上批准
# 三个包要分别批准，且先批准 server 版本，再批准 mcp / pi-extension（它们依赖 npm 上的
# @black942026/harness-acp-bridge-server）。
#
# 注意：暂存版本与已发布版本共用同一套版本号索引，同一个版本号只能 stage 一次。暂存成功后
# 不要对同一 tag 重跑本流水线（会报版本已存在），要么去批准，要么先 `npm stage reject` 再重跑。
on:
  push:
    tags:
      - 'v*.*.*'
      - 'server-v*.*.*'
      - 'mcp-v*.*.*'
      - 'pi-extension-v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 是否为全局 tag（v 开头，发布全部三个包）
      PUBLISH_ALL: ${{ startsWith(github.ref_name, 'v') }}
    steps:
      # 子模块地址是 git@github.com:...，Actions 无 SSH key，需转为 HTTPS
      - name: Use HTTPS for submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # `npm stage publish` 需要 npm CLI >= 11.15（stage 子命令），node 22 自带的 npm 10.x 没有；
      # 固定主版本，避免 npm 升级到下一个大版本时流水线行为悄悄变化
      - name: Upgrade npm
        run: npm install -g npm@^12

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="${TAG#*-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Verify versions match tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          check() {
            local dir="$1"
            local actual
            actual="$(node -p "require('./$dir/package.json').version")"
            if [[ "$actual" != "$VERSION" ]]; then
              echo "::error::$dir/package.json version ($actual) does not match tag ($VERSION)"
              exit 1
            fi
          }
          if [[ "$PUBLISH_ALL" == "true" ]]; then
            check server
            check mcp
            check pi-extension
          else
            case "$GITHUB_REF_NAME" in
              server-v*)       check server ;;
              mcp-v*)          check mcp ;;
              pi-extension-v*) check pi-extension ;;
            esac
          fi
          echo "All versions match tag $VERSION"

      # 所有选中包先完成干净安装和检查，避免 server 已暂存后才发现客户端锁文件失配。
      # 即使只发布客户端也构建 server，让集成测试使用本次检出的 server，而不是跳过。
      - name: Validate server
        working-directory: server
        run: |
          npm ci
          npm run check

      # 客户端独立安装和检查，不加载或安装另一个客户端。
      - name: Validate mcp
        if: env.PUBLISH_ALL == 'true' || startsWith(github.ref_name, 'mcp-v')
        working-directory: mcp
        run: |
          npm ci
          npm run check

      - name: Validate pi-extension
        if: env.PUBLISH_ALL == 'true' || startsWith(github.ref_name, 'pi-extension-v')
        working-directory: pi-extension
        run: |
          npm ci
          npm run fix:dev-deps
          npm run check

      # server 必须先暂存：mcp 和 pi-extension 依赖 npm 上的 @black942026/harness-acp-bridge-server
      - name: Stage @black942026/harness-acp-bridge-server
        if: env.PUBLISH_ALL == 'true' || startsWith(github.ref_name, 'server-v')
        working-directory: server
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Stage @black942026/harness-acp-bridge-mcp
        if: env.PUBLISH_ALL == 'true' || startsWith(github.ref_name, 'mcp-v')
        working-directory: mcp
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Stage @black942026/harness-acp-bridge-pi-extension
        if: env.PUBLISH_ALL == 'true' || startsWith(github.ref_name, 'pi-extension-v')
        working-directory: pi-extension
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
